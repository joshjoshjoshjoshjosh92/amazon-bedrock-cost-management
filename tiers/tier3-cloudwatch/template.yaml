AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Bedrock Cost Tracker - Tier 3: CloudWatch Monitoring
  Extracts token-level metrics from Bedrock model invocation logs,
  presents them in dashboards, and triggers configurable alarms.

# ------------------------------------------------------------------------------
# Parameters
# ------------------------------------------------------------------------------
Parameters:
  EnvironmentName:
    Type: String
    Default: "production"
    Description: Environment name for resource tagging and identification

  NotificationEmail:
    Type: String
    Description: Email address for alarm notifications

  ResourcePrefix:
    Type: String
    Default: "bedrock-tracker"
    Description: Prefix for resource names to avoid collisions

  MonitoredModels:
    Type: CommaDelimitedList
    Default: "*"
    Description: Comma-separated list of Bedrock model IDs to monitor (use * for all)

  TokenAlarmThreshold:
    Type: Number
    Default: 1000000
    Description: Token count threshold for triggering alarms (default 1M tokens)

  AlarmEvaluationPeriod:
    Type: Number
    Default: 300
    Description: Alarm evaluation period in seconds (default 5 minutes)

# ------------------------------------------------------------------------------
# Resources
# ------------------------------------------------------------------------------
Resources:

  # --------------------------------------------------------------------------
  # Bedrock Model Invocation Logging Role
  # NOTE: This role is created outside CloudFormation (by deploy.sh or manually)
  # to avoid conflicts. The deploy script enables logging using this role ARN.
  # Role name: ${ResourcePrefix}-bedrock-logging-role
  # --------------------------------------------------------------------------

  # --------------------------------------------------------------------------
  # CloudWatch Log Group for Bedrock Model Invocation Logs
  # --------------------------------------------------------------------------
  BedrockInvocationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/bedrock/${ResourcePrefix}-model-invocations"
      RetentionInDays: 90
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Application
          Value: !Ref ResourcePrefix

  # --------------------------------------------------------------------------
  # Metric Filters — Extract metrics from Bedrock invocation logs
  # --------------------------------------------------------------------------
  InputTokenCountMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref BedrockInvocationLogGroup
      FilterPattern: '{ $.schemaType = "ModelInvocationLog" && $.inputTokenCount = * }'
      MetricTransformations:
        - MetricNamespace: BedrockCostTracker
          MetricName: InputTokenCount
          MetricValue: $.inputTokenCount
          Dimensions:
            - Key: ModelId
              Value: $.modelId
            - Key: AccountId
              Value: $.accountId

  OutputTokenCountMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref BedrockInvocationLogGroup
      FilterPattern: '{ $.schemaType = "ModelInvocationLog" && $.outputTokenCount = * }'
      MetricTransformations:
        - MetricNamespace: BedrockCostTracker
          MetricName: OutputTokenCount
          MetricValue: $.outputTokenCount
          Dimensions:
            - Key: ModelId
              Value: $.modelId
            - Key: AccountId
              Value: $.accountId

  InvocationCountMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref BedrockInvocationLogGroup
      FilterPattern: '{ $.schemaType = "ModelInvocationLog" }'
      MetricTransformations:
        - MetricNamespace: BedrockCostTracker
          MetricName: InvocationCount
          MetricValue: "1"

  LatencyMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref BedrockInvocationLogGroup
      FilterPattern: '{ $.schemaType = "ModelInvocationLog" && $.latencyMs = * }'
      MetricTransformations:
        - MetricNamespace: BedrockCostTracker
          MetricName: Latency
          MetricValue: $.latencyMs
          Dimensions:
            - Key: ModelId
              Value: $.modelId

  # --------------------------------------------------------------------------
  # Additional Metric Filters — Team/Application Attribution + Cost
  # --------------------------------------------------------------------------
  TeamTokenMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref BedrockInvocationLogGroup
      FilterPattern: '{ $.schemaType = "ModelInvocationLog" && $.inputTokenCount = * }'
      MetricTransformations:
        - MetricNamespace: BedrockCostTracker
          MetricName: TeamInputTokens
          MetricValue: $.inputTokenCount
          Dimensions:
            - Key: Team
              Value: $.metadata.team
            - Key: ModelId
              Value: $.modelId

  TeamOutputTokenMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref BedrockInvocationLogGroup
      FilterPattern: '{ $.schemaType = "ModelInvocationLog" && $.outputTokenCount = * }'
      MetricTransformations:
        - MetricNamespace: BedrockCostTracker
          MetricName: TeamOutputTokens
          MetricValue: $.outputTokenCount
          Dimensions:
            - Key: Team
              Value: $.metadata.team
            - Key: ModelId
              Value: $.modelId

  ApplicationInvocationMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref BedrockInvocationLogGroup
      FilterPattern: '{ $.schemaType = "ModelInvocationLog" && $.metadata.application = * }'
      MetricTransformations:
        - MetricNamespace: BedrockCostTracker
          MetricName: ApplicationInvocations
          MetricValue: "1"
          Dimensions:
            - Key: Application
              Value: $.metadata.application
            - Key: Team
              Value: $.metadata.team

  ErrorCountMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref BedrockInvocationLogGroup
      FilterPattern: '{ $.schemaType = "ModelInvocationLog" && $.errorCode = * }'
      MetricTransformations:
        - MetricNamespace: BedrockCostTracker
          MetricName: ErrorCount
          MetricValue: "1"
          Dimensions:
            - Key: ModelId
              Value: $.modelId
            - Key: ErrorCode
              Value: $.errorCode

  ThrottleCountMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref BedrockInvocationLogGroup
      FilterPattern: '{ $.schemaType = "ModelInvocationLog" && $.errorCode = "ThrottlingException" }'
      MetricTransformations:
        - MetricNamespace: BedrockCostTracker
          MetricName: ThrottleCount
          MetricValue: "1"
          Dimensions:
            - Key: ModelId
              Value: $.modelId

  # --------------------------------------------------------------------------
  # SNS Topic for Alarm Notifications
  # --------------------------------------------------------------------------
  AlarmNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${ResourcePrefix}-alarm-notifications"
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Application
          Value: !Ref ResourcePrefix

  AlarmNotificationSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlarmNotificationTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  # --------------------------------------------------------------------------
  # CloudWatch Alarms
  # --------------------------------------------------------------------------
  InputTokenThresholdAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ResourcePrefix}-input-token-threshold"
      AlarmDescription: !Sub "Input token count exceeded ${TokenAlarmThreshold} within evaluation period"
      Namespace: BedrockCostTracker
      MetricName: InputTokenCount
      Statistic: Sum
      Period: !Ref AlarmEvaluationPeriod
      EvaluationPeriods: 1
      Threshold: !Ref TokenAlarmThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic
      OKActions:
        - !Ref AlarmNotificationTopic

  OutputTokenThresholdAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ResourcePrefix}-output-token-threshold"
      AlarmDescription: !Sub "Output token count exceeded ${TokenAlarmThreshold} within evaluation period"
      Namespace: BedrockCostTracker
      MetricName: OutputTokenCount
      Statistic: Sum
      Period: !Ref AlarmEvaluationPeriod
      EvaluationPeriods: 1
      Threshold: !Ref TokenAlarmThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic
      OKActions:
        - !Ref AlarmNotificationTopic

  # --------------------------------------------------------------------------
  # CloudWatch Dashboard
  # --------------------------------------------------------------------------
  BedrockCostDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${ResourcePrefix}-${EnvironmentName}"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "text",
              "x": 0,
              "y": 0,
              "width": 24,
              "height": 2,
              "properties": {
                "markdown": "# 🤖 Amazon Bedrock Cost Intelligence — ${EnvironmentName}\n**Real-time AI spend visibility** | Token consumption | Per-team attribution | Budget tracking"
              }
            },
            {
              "type": "text",
              "x": 0,
              "y": 2,
              "width": 24,
              "height": 1,
              "properties": {
                "markdown": "## 💰 Executive Summary — What are we spending on AI?"
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 3,
              "width": 6,
              "height": 4,
              "properties": {
                "metrics": [
                  ["BedrockCostTracker", "InvocationCount", {"stat": "Sum", "label": "Total Invocations"}]
                ],
                "view": "singleValue",
                "region": "${AWS::Region}",
                "title": "Invocations (Last 24h)",
                "period": 86400,
                "sparkline": true
              }
            },
            {
              "type": "metric",
              "x": 6,
              "y": 3,
              "width": 6,
              "height": 4,
              "properties": {
                "metrics": [
                  ["BedrockCostTracker", "InputTokenCount", {"stat": "Sum", "label": "Input"}],
                  ["BedrockCostTracker", "OutputTokenCount", {"stat": "Sum", "label": "Output"}]
                ],
                "view": "singleValue",
                "region": "${AWS::Region}",
                "title": "Tokens Consumed (Last 24h)",
                "period": 86400,
                "sparkline": true
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 3,
              "width": 6,
              "height": 4,
              "properties": {
                "metrics": [
                  ["BedrockCostTracker", "InvocationCount", {"stat": "Sum", "label": "This Week"}]
                ],
                "view": "singleValue",
                "region": "${AWS::Region}",
                "title": "Invocations (Last 7 Days)",
                "period": 604800,
                "sparkline": true
              }
            },
            {
              "type": "metric",
              "x": 18,
              "y": 3,
              "width": 6,
              "height": 4,
              "properties": {
                "metrics": [
                  ["BedrockCostTracker", "ErrorCount", {"stat": "Sum", "label": "Errors"}],
                  ["BedrockCostTracker", "ThrottleCount", {"stat": "Sum", "label": "Throttles"}]
                ],
                "view": "singleValue",
                "region": "${AWS::Region}",
                "title": "Errors & Throttles (24h)",
                "period": 86400,
                "sparkline": true
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 7,
              "width": 24,
              "height": 6,
              "properties": {
                "metrics": [
                  ["BedrockCostTracker", "InputTokenCount", {"stat": "Sum", "label": "Input Tokens"}],
                  ["BedrockCostTracker", "OutputTokenCount", {"stat": "Sum", "label": "Output Tokens"}]
                ],
                "view": "timeSeries",
                "stacked": true,
                "region": "${AWS::Region}",
                "title": "📈 Token Consumption Trend (Hourly)",
                "period": 3600,
                "yAxis": {"left": {"label": "Tokens", "showUnits": false}},
                "annotations": {
                  "horizontal": [
                    {"label": "Daily Budget (tokens)", "value": ${TokenAlarmThreshold}, "color": "#d13212"}
                  ]
                }
              }
            },
            {
              "type": "text",
              "x": 0,
              "y": 13,
              "width": 24,
              "height": 1,
              "properties": {
                "markdown": "## 👥 Team & Model Breakdown — Who is spending what?"
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 14,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  ["BedrockCostTracker", "InputTokenCount", "ModelId", "anthropic.claude-3-sonnet-20240229-v1:0", {"stat": "Sum", "label": "Claude 3 Sonnet"}],
                  ["BedrockCostTracker", "InputTokenCount", "ModelId", "anthropic.claude-3-haiku-20240307-v1:0", {"stat": "Sum", "label": "Claude 3 Haiku"}],
                  ["BedrockCostTracker", "InputTokenCount", "ModelId", "anthropic.claude-3-5-sonnet-20241022-v2:0", {"stat": "Sum", "label": "Claude 3.5 Sonnet"}],
                  ["BedrockCostTracker", "InputTokenCount", "ModelId", "us.anthropic.claude-sonnet-4-20250514-v1:0", {"stat": "Sum", "label": "Claude Sonnet 4"}]
                ],
                "view": "timeSeries",
                "stacked": true,
                "region": "${AWS::Region}",
                "title": "Token Usage by Model",
                "period": 3600
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 14,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  ["BedrockCostTracker", "TeamInputTokens", {"stat": "Sum"}]
                ],
                "view": "pie",
                "region": "${AWS::Region}",
                "title": "Token Distribution by Team",
                "period": 86400,
                "setPeriodToTimeRange": true
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 20,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  ["BedrockCostTracker", "ApplicationInvocations", {"stat": "Sum"}]
                ],
                "view": "bar",
                "region": "${AWS::Region}",
                "title": "Invocations by Application (Last 24h)",
                "period": 86400,
                "setPeriodToTimeRange": true
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 20,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  ["BedrockCostTracker", "InvocationCount", "ModelId", "anthropic.claude-3-sonnet-20240229-v1:0", {"stat": "Sum", "label": "Sonnet"}],
                  ["BedrockCostTracker", "InvocationCount", "ModelId", "anthropic.claude-3-haiku-20240307-v1:0", {"stat": "Sum", "label": "Haiku"}],
                  ["BedrockCostTracker", "InvocationCount", "ModelId", "anthropic.claude-3-5-sonnet-20241022-v2:0", {"stat": "Sum", "label": "3.5 Sonnet"}],
                  ["BedrockCostTracker", "InvocationCount", "ModelId", "us.anthropic.claude-sonnet-4-20250514-v1:0", {"stat": "Sum", "label": "Sonnet 4"}]
                ],
                "view": "bar",
                "region": "${AWS::Region}",
                "title": "Invocations by Model (Last 24h)",
                "period": 86400,
                "setPeriodToTimeRange": true
              }
            },
            {
              "type": "text",
              "x": 0,
              "y": 26,
              "width": 24,
              "height": 1,
              "properties": {
                "markdown": "## ⚙️ Operational Health — Is the system performing well?"
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 27,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  ["BedrockCostTracker", "Latency", {"stat": "Average", "label": "Avg Latency"}],
                  ["BedrockCostTracker", "Latency", {"stat": "p50", "label": "p50"}],
                  ["BedrockCostTracker", "Latency", {"stat": "p90", "label": "p90"}],
                  ["BedrockCostTracker", "Latency", {"stat": "p99", "label": "p99"}]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Response Latency (ms)",
                "period": 300,
                "yAxis": {"left": {"label": "ms", "showUnits": false}}
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 27,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  ["BedrockCostTracker", "ErrorCount", {"stat": "Sum", "label": "Errors", "color": "#d13212"}],
                  ["BedrockCostTracker", "ThrottleCount", {"stat": "Sum", "label": "Throttles", "color": "#ff9900"}]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Errors & Throttling",
                "period": 300,
                "yAxis": {"left": {"label": "Count", "showUnits": false}}
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 33,
              "width": 8,
              "height": 4,
              "properties": {
                "metrics": [
                  ["BedrockCostTracker", "Latency", {"stat": "Average", "label": "Avg Latency (ms)"}]
                ],
                "view": "gauge",
                "region": "${AWS::Region}",
                "title": "Current Avg Latency",
                "period": 300,
                "yAxis": {"left": {"min": 0, "max": 10000}}
              }
            },
            {
              "type": "metric",
              "x": 8,
              "y": 33,
              "width": 8,
              "height": 4,
              "properties": {
                "metrics": [
                  ["BedrockCostTracker", "InvocationCount", {"stat": "Sum", "label": "Requests/5min"}]
                ],
                "view": "gauge",
                "region": "${AWS::Region}",
                "title": "Current Throughput (5min)",
                "period": 300,
                "yAxis": {"left": {"min": 0, "max": 1000}}
              }
            },
            {
              "type": "metric",
              "x": 16,
              "y": 33,
              "width": 8,
              "height": 4,
              "properties": {
                "metrics": [
                  ["BedrockCostTracker", "ErrorCount", {"stat": "Sum", "label": "Errors/5min"}]
                ],
                "view": "gauge",
                "region": "${AWS::Region}",
                "title": "Error Rate (5min)",
                "period": 300,
                "yAxis": {"left": {"min": 0, "max": 100}},
                "annotations": {
                  "horizontal": [
                    {"label": "Warning", "value": 10, "color": "#ff9900"},
                    {"label": "Critical", "value": 50, "color": "#d13212"}
                  ]
                }
              }
            },
            {
              "type": "text",
              "x": 0,
              "y": 37,
              "width": 24,
              "height": 1,
              "properties": {
                "markdown": "---\n*Dashboard auto-refreshes every 5 minutes. Data from CloudWatch metric filters on Bedrock model invocation logs. For historical analytics and chargeback reports, deploy Tier 4 (CUR + Athena).*"
              }
            }
          ]
        }

# ------------------------------------------------------------------------------
# Outputs
# ------------------------------------------------------------------------------
Outputs:
  LogGroupName:
    Description: CloudWatch Log Group for Bedrock model invocation logs
    Value: !Ref BedrockInvocationLogGroup

  LogGroupArn:
    Description: ARN of the CloudWatch Log Group
    Value: !GetAtt BedrockInvocationLogGroup.Arn

  BedrockLoggingRoleArn:
    Description: IAM Role ARN for Bedrock model invocation logging
    Value: !Sub "arn:aws:iam::${AWS::AccountId}:role/${ResourcePrefix}-bedrock-logging-role"

  DashboardName:
    Description: CloudWatch Dashboard name
    Value: !Ref BedrockCostDashboard

  DashboardUrl:
    Description: Direct URL to the CloudWatch Dashboard
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${ResourcePrefix}-${EnvironmentName}"

  AlarmTopicArn:
    Description: SNS Topic ARN for alarm notifications
    Value: !Ref AlarmNotificationTopic

  InputTokenAlarmArn:
    Description: ARN of the input token threshold alarm
    Value: !GetAtt InputTokenThresholdAlarm.Arn

  OutputTokenAlarmArn:
    Description: ARN of the output token threshold alarm
    Value: !GetAtt OutputTokenThresholdAlarm.Arn
